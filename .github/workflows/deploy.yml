name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - name: Push secrets to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "${{ secrets.AGENT_WALLET_ADDRESS }}" | npx wrangler secret put AGENT_WALLET_ADDRESS
          echo "${{ secrets.AGENT_PRIVATE_KEY }}" | npx wrangler secret put AGENT_PRIVATE_KEY
          echo "${{ secrets.RPC_ENDPOINT_URL }}" | npx wrangler secret put RPC_ENDPOINT_URL
          echo "${{ secrets.WALLET_ID }}" | npx wrangler secret put WALLET_ID
          echo "${{ secrets.SIGNER_PRIVATE_KEY }}" | npx wrangler secret put SIGNER_PRIVATE_KEY
          echo "${{ secrets.BUILDER_CODE }}" | npx wrangler secret put BUILDER_CODE

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
